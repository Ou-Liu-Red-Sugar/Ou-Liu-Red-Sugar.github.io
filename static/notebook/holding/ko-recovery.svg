<svg xmlns="http://www.w3.org/2000/svg" width="820" height="416" viewBox="0 0 820 416" role="img" aria-labelledby="title desc">
  <title id="title">KO：共同担忧下的下跌与修复</title>
  <desc id="desc">2023年9月29日至12月29日，KO与消费必需品ETF XLP拆股调整后收盘价以期初为100比较。KO在10月5日跌至93.6（52.38美元），10月24日发布Q3财报后逐步修复，期末KO为+5.3%（58.93美元），XLP为+4.7%。</desc>
