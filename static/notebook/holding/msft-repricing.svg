<svg xmlns="http://www.w3.org/2000/svg" width="820" height="478" viewBox="0 0 820 478" role="img" aria-labelledby="title desc">
  <title id="title">MSFT：FY26 Q4 财报后的重新定价</title>
  <desc id="desc">MSFT在2026年7月29日盘后发布FY26 Q4财报，收盘价从390.54美元跳升至次日451.10美元（+15.5%），并伴随1.10亿股放量（约前一交易日2.3倍）；虚线保留财报前近20日上轨参考401.7美元作对照，8月7日收于499.99美元。</desc>
