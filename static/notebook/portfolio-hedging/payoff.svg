<svg xmlns="http://www.w3.org/2000/svg" width="720" height="368" viewBox="0 0 720 368" role="img" aria-labelledby="title desc">
<title id="title">100 份 VOO 到期损益：直接持有与加买 1 张 685 美元 Put 的比较</title>
<desc id="desc">按 710.48 美元观察价持有 100 份 VOO，与加买 1 张行权价 685 美元、权利金 1,037 美元加 1 美元费用的保护性 Put 对比。VOO 跌破 685 美元时，加买 Put 的到期损益锁定在约 −3,586 美元下限；高于 685 美元时，两者同步上涨，加买 Put 少赚 1,038 美元权利金与费用。</desc>
<style>
  text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; font-variant-numeric: lining-nums tabular-nums; fill: #22392f; }
  .title { font-size: 15.5px; font-weight: 700; }
  .sub { font-size: 12px; fill: #7a8780; }
  .legend { font-size: 12px; fill: #3c4c44; }
  .tick { font-size: 11.5px; fill: #7a8780; }
  .axis { font-size: 12px; font-weight: 600; fill: #3c4c44; }
  .note-teal { font-size: 12px; font-weight: 650; fill: #23695a; }
  .note-warm { font-size: 11.5px; font-weight: 600; fill: #8f6033; }
  .note-muted { font-size: 11px; fill: #69796f; }
</style>

<rect x="1" y="1" width="718" height="366" rx="10" fill="#fbfbf6" stroke="#e2e7df" stroke-width="1.5"/>

<!-- Header (two clean rows so title & legend never collide) -->
<text x="24" y="28" class="title">100 份 VOO 到期损益：直接持有 vs 加买 1 张 685 美元 Put</text>
<text x="24" y="48" class="sub">观察价 710.48 美元 · Put 权利金 1,037 美元＋1 美元费用</text>
<line x1="436" y1="44" x2="458" y2="44" stroke="#8e9c93" stroke-width="2" stroke-dasharray="5 3"/>
<text x="464" y="48" class="legend">只持有 100 份 VOO</text>
<line x1="582" y1="44" x2="604" y2="44" stroke="#23695a" stroke-width="2.8"/>
<text x="610" y="48" class="legend">VOO ＋ 1 张 Put</text>

<!-- Plot area: x=[76, 684] (550..900), y=[68, 298] (+20..-20 kUSD) -->
<rect x="76" y="68" width="608" height="230" fill="#fdfdfa" stroke="#e2e7df" stroke-width="1"/>

<!-- Horizontal gridlines -->
<line x1="76" y1="68" x2="684" y2="68" stroke="#e8ede6" stroke-width="1"/>
<line x1="76" y1="125.5" x2="684" y2="125.5" stroke="#e8ede6" stroke-width="1"/>
<line x1="76" y1="183" x2="684" y2="183" stroke="#9eb0a5" stroke-width="1.2"/>
<line x1="76" y1="240.5" x2="684" y2="240.5" stroke="#e8ede6" stroke-width="1"/>
<line x1="76" y1="298" x2="684" y2="298" stroke="#e8ede6" stroke-width="1"/>

<!-- Vertical gridlines -->
<line x1="162.9" y1="68" x2="162.9" y2="298" stroke="#eef2ec" stroke-width="1"/>
<line x1="249.7" y1="68" x2="249.7" y2="298" stroke="#eef2ec" stroke-width="1"/>
<line x1="336.6" y1="68" x2="336.6" y2="298" stroke="#eef2ec" stroke-width="1"/>
<line x1="423.4" y1="68" x2="423.4" y2="298" stroke="#eef2ec" stroke-width="1"/>
<line x1="510.3" y1="68" x2="510.3" y2="298" stroke="#eef2ec" stroke-width="1"/>
<line x1="597.1" y1="68" x2="597.1" y2="298" stroke="#eef2ec" stroke-width="1"/>

<!-- Shaded downside protection wedge (S < 674.62) -->
<polygon points="76,203.62 292.48,203.62 76,275.28" fill="#23695a" fill-opacity="0.11"/>
<text x="88" y="225" class="note-teal" fill-opacity="0.9">Put 抵补的下跌损失</text>

<!-- Strike line K = 685 (x = 310.51) -->
<line x1="310.5" y1="68" x2="310.5" y2="298" stroke="#a8743f" stroke-width="1.4" stroke-dasharray="4 4"/>
<rect x="316" y="272" width="78" height="20" rx="4" fill="#f5ebdf" stroke="#e4cca9" stroke-width="0.8"/>
<text x="355" y="286" class="note-warm" text-anchor="middle">行权价 685</text>

<!-- Unhedged VOO payoff line: (550, -16.048k) -> (900, +18.952k) -->
<line x1="76" y1="275.28" x2="684" y2="74.03" stroke="#8e9c93" stroke-width="2" stroke-dasharray="6 4"/>

<!-- Hedged VOO + Put payoff line: flat -3.586k to 685, then up to (900, +17.914k) -->
<polyline points="76,203.62 310.51,203.62 684,79.99" fill="none" stroke="#23695a" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>

<!-- Key points -->
<circle cx="310.51" cy="203.62" r="4.5" fill="#23695a" stroke="#fdfdfa" stroke-width="1.6"/>
<circle cx="354.78" cy="183" r="3.8" fill="#8e9c93" stroke="#fdfdfa" stroke-width="1.5"/>
<text x="364" y="197" class="note-muted">观察买入价 710.48</text>

<!-- Floor callout -->
<rect x="86" y="139" width="214" height="26" rx="6" fill="#e5efe9" stroke="#b9d0c2" stroke-width="1"/>
<text x="193" y="156" class="note-teal" text-anchor="middle">保护后到期下限：约 −3,586 美元</text>
<path d="M193 165 Q193 185 178 199" fill="none" stroke="#23695a" stroke-width="1.3"/>

<!-- Cost gap annotation on upside (around S = 815, x = 536.3) -->
<line x1="536.3" y1="122.9" x2="536.3" y2="128.9" stroke="#a8743f" stroke-width="2.2"/>
<path d="M536.3 131 L548 154" fill="none" stroke="#a8743f" stroke-width="1.2"/>
<rect x="468" y="154" width="206" height="24" rx="6" fill="#f5ebdf" stroke="#e4cca9" stroke-width="1"/>
<text x="571" y="170" class="note-warm" text-anchor="middle">上涨时少赚 1,038 美元权利金与费用</text>

<!-- Y-axis ticks -->
<text x="68" y="72" class="tick" text-anchor="end">+20</text>
<text x="68" y="129.5" class="tick" text-anchor="end">+10</text>
<text x="68" y="187" class="tick" text-anchor="end">0</text>
<text x="68" y="244.5" class="tick" text-anchor="end">−10</text>
<text x="68" y="302" class="tick" text-anchor="end">−20</text>
<text x="22" y="183" class="axis" text-anchor="middle" transform="rotate(-90 22 183)">这部分持仓的损益（千美元）</text>

<!-- X-axis ticks -->
<text x="76" y="316" class="tick" text-anchor="middle">550</text>
<text x="162.9" y="316" class="tick" text-anchor="middle">600</text>
<text x="249.7" y="316" class="tick" text-anchor="middle">650</text>
<text x="336.6" y="316" class="tick" text-anchor="middle">700</text>
<text x="423.4" y="316" class="tick" text-anchor="middle">750</text>
<text x="510.3" y="316" class="tick" text-anchor="middle">800</text>
<text x="597.1" y="316" class="tick" text-anchor="middle">850</text>
<text x="684" y="316" class="tick" text-anchor="middle">900</text>
<text x="380" y="342" class="axis" text-anchor="middle">VOO 到期价格（美元／份）</text>
</svg>
