<!DOCTYPE html>
<html lang="zh"><link href="../styles.css" rel="stylesheet"/><meta charset="utf-8"/><title>M23 静态等价</title><body><h1>M23 静态等价</h1><div class="table-wrap"><table><thead><tr><th>发起方向</th><th>合约份数</th><th>符号</th></tr></thead><tbody><tr><td>买call</td><td>30</td><td>+</td></tr><tr><td>卖call</td><td>10</td><td>−</td></tr><tr><td>买put</td><td>25</td><td>−</td></tr><tr><td>卖put</td><td>35</td><td>+</td></tr></tbody></table></div><div class="table-wrap"><table><thead><tr><th>量</th><th>计算</th></tr></thead><tbody><tr><td>TOI</td><td>(30+35−10−25)/100=0.30</td></tr><tr><td>异常OI</td><td>0.30−0.05=0.25</td></tr><tr><td>put/call量</td><td>60/40=1.5</td></tr><tr><td>宏观日标准化系数</td><td>.0033+.0250=.0283</td></tr><tr><td>与合并列比较</td><td>.0283/.0078≈3.6282</td></tr></tbody></table></div><p>单位是按发起方向分类的成交合约份数，size加权. 论文按宏观/非宏观组标准化；系数不是交易收益. 估计窗口τ−300…−46，基线τ−40…−10，公告前流量τ−1，CAR[0,1]. 事后消息标签不能倒放.</p></body></html>
