<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 361" role="img" aria-label="同一个终值，不同费用归属切点"><title>同一个终值，不同费用归属切点</title><desc>外部现金100在第1期后投入；每期费用2</desc><style>text{font-family:system-ui,sans-serif;fill:currentColor;font-size:15px} .title{font-size:22px;font-weight:650} .sub{font-size:14px} .axis{stroke:currentColor;stroke-width:1;opacity:.45} .grid{stroke:currentColor;stroke-width:1;opacity:.12}</style><text class="title" x="30" y="32">同一个终值，不同费用归属切点</text><text class="sub" x="30" y="57">外部现金100在第1期后投入；每期费用2</text><rect x="25" y="85" width="750" height="65" rx="6" fill="none" stroke="currentColor" stroke-opacity=".3"/><text x="42" y="110" font-weight="650">基准：入金前确认</text><text x="285" y="110">100 → 110 → 108 → 208 → 185.2</text><text x="285" y="134">入金切点净资产108；TWR −3.83846%</text><rect x="25" y="167" width="750" height="65" rx="6" fill="none" stroke="currentColor" stroke-opacity=".3"/><text x="42" y="192" font-weight="650">仅延期支付</text><text x="285" y="192">入金前现金110，应付费用2，NAV108</text><text x="285" y="216">支付时现金/负债同减；TWR不变</text><rect x="25" y="249" width="750" height="65" rx="6" fill="none" stroke="currentColor" stroke-opacity=".3"/><text x="42" y="274" font-weight="650">入金后才确认</text><text x="285" y="274">100 → 110 → 210 → 208 → 185.2</text><text x="285" y="298">入金切点净资产110；TWR −2.99048%</text></svg>