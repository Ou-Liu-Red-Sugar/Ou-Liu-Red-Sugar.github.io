<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 443" role="img" aria-label="理论链与样本链，不是同一个推断"><title>理论链与样本链，不是同一个推断</title><desc>共同风险进入两种关系，但成立条件不同</desc><style>text{font-family:system-ui,sans-serif;fill:currentColor;font-size:15px} .title{font-size:22px;font-weight:650} .sub{font-size:14px} .axis{stroke:currentColor;stroke-width:1;opacity:.45} .grid{stroke:currentColor;stroke-width:1;opacity:.12}</style><text class="title" x="30" y="32">理论链与样本链，不是同一个推断</text><text class="sub" x="30" y="57">共同风险进入两种关系，但成立条件不同</text><rect x="25" y="85" width="750" height="65" rx="6" fill="none" stroke="currentColor" stroke-opacity=".3"/><text x="42" y="110" font-weight="650">理论起点</text><text x="285" y="110">均值—方差优化、共同预期、无摩擦借贷</text><text x="285" y="134">正定协方差 → 个体风险头寸沿共同方向</text><rect x="25" y="167" width="750" height="65" rx="6" fill="none" stroke="currentColor" stroke-opacity=".3"/><text x="42" y="192" font-weight="650">市场清算</text><text x="285" y="192">个体头寸总和对应市场供给</text><text x="285" y="216">得到期望超额收益与市场beta的均衡关系</text><rect x="25" y="249" width="750" height="65" rx="6" fill="none" stroke="currentColor" stroke-opacity=".3"/><text x="42" y="274" font-weight="650">经验回归</text><text x="285" y="274">给定一段真实已实现收益与所选因子</text><text x="285" y="298">最小二乘正交 → 样本均值归因</text><rect x="25" y="331" width="750" height="65" rx="6" fill="none" stroke="currentColor" stroke-opacity=".3"/><text x="42" y="356" font-weight="650">判断边界</text><text x="285" y="356">正截距不是未来收益或技能的证明</text><text x="285" y="380">换模型/窗口会改变解释，而不会改变历史收益</text></svg>