<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 443" role="img" aria-label="复盘沿当时信息推进"><title>复盘沿当时信息推进</title><desc>同P23唯一玉米账；结果不能反写交易前条件</desc><style>text{font-family:system-ui,sans-serif;fill:currentColor;font-size:15px} .title{font-size:22px;font-weight:650} .sub{font-size:14px} .axis{stroke:currentColor;stroke-width:1;opacity:.45} .grid{stroke:currentColor;stroke-width:1;opacity:.12}</style><text class="title" x="30" y="32">复盘沿当时信息推进</text><text class="sub" x="30" y="57">同P23唯一玉米账；结果不能反写交易前条件</text><rect x="25" y="85" width="750" height="65" rx="6" fill="none" stroke="currentColor" stroke-opacity=".3"/><text x="42" y="110" font-weight="650">初始计划</text><text x="285" y="110">未来采购15,000蒲式耳；多3张</text><text x="285" y="134">当前流动资金16,000，90,000尚受限</text><rect x="25" y="167" width="750" height="65" rx="6" fill="none" stroke="currentColor" stroke-opacity=".3"/><text x="42" y="192" font-weight="650">第1压力点</text><text x="285" y="192">期货5.45；变动现金−4,500</text><text x="285" y="216">补足后自由资金2,500</text><rect x="25" y="249" width="750" height="65" rx="6" fill="none" stroke="currentColor" stroke-opacity=".3"/><text x="42" y="274" font-weight="650">第2压力点</text><text x="285" y="274">期货5.10；应补5,250</text><text x="285" y="298">无授信，缺2,750 → 按教学价退出</text><rect x="25" y="331" width="750" height="65" rx="6" fill="none" stroke="currentColor" stroke-opacity=".3"/><text x="42" y="356" font-weight="650">采购日</text><text x="285" y="356">现货6.20；支付93,000</text><text x="285" y="380">期货已经关闭，不取得后段17,250反弹</text></svg>