<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 361" role="img" aria-label="从经营现金方向推出期货方向"><title>从经营现金方向推出期货方向</title><desc>数量、地点、品质和日期仍需分别匹配</desc><style>text{font-family:system-ui,sans-serif;fill:currentColor;font-size:15px} .title{font-size:22px;font-weight:650} .sub{font-size:14px} .axis{stroke:currentColor;stroke-width:1;opacity:.45} .grid{stroke:currentColor;stroke-width:1;opacity:.12}</style><text class="title" x="30" y="32">从经营现金方向推出期货方向</text><text class="sub" x="30" y="57">数量、地点、品质和日期仍需分别匹配</text><rect x="25" y="85" width="750" height="65" rx="6" fill="none" stroke="currentColor" stroke-opacity=".3"/><text x="42" y="110" font-weight="650">采购：未来要付钱</text><text x="285" y="110">担心现货上涨 → 期货多头</text><text x="285" y="134">实物支出 − 期货所得 = 有效采购成本</text><rect x="25" y="167" width="750" height="65" rx="6" fill="none" stroke="currentColor" stroke-opacity=".3"/><text x="42" y="192" font-weight="650">销售：未来要收钱</text><text x="285" y="192">担心现货下跌 → 期货空头</text><text x="285" y="216">实物收入 + 期货所得 = 有效销售收入</text><rect x="25" y="249" width="750" height="65" rx="6" fill="none" stroke="currentColor" stroke-opacity=".3"/><text x="42" y="274" font-weight="650">共同剩余</text><text x="285" y="274">终点基差 b = S当地 − F</text><text x="285" y="298">数量全配且同日退出时，有效单价 = F0 + b</text></svg>