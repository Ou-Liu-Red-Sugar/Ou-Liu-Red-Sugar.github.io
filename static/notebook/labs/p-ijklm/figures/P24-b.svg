<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-label="把方向、资金和终点拆开"><title>把方向、资金和终点拆开</title><desc>实际教学关闭分支的有效采购成本</desc><style>text{font-family:system-ui,sans-serif;fill:currentColor;font-size:15px} .title{font-size:22px;font-weight:650} .sub{font-size:14px} .axis{stroke:currentColor;stroke-width:1;opacity:.45} .grid{stroke:currentColor;stroke-width:1;opacity:.12}</style><text class="title" x="30" y="32">把方向、资金和终点拆开</text><text class="sub" x="30" y="57">实际教学关闭分支的有效采购成本</text><text x="30" y="88">美元；采购取得实物，现金支出不是全部财富损失</text><text x="183" y="148.28333333333333" text-anchor="end">实物付款</text><rect x="195.0" y="112.0" width="488.7591240875913" height="67.66666666666667" fill="none" stroke="currentColor" stroke-width="2"/><text x="691.7591240875913" y="148.28333333333333" text-anchor="start">93,000.000</text><text x="183" y="229.95000000000002" text-anchor="end">期货已实现损失</text><rect x="195.0" y="193.66666666666669" width="51.24087591240874" height="67.66666666666667" fill="none" stroke="currentColor" stroke-width="2"/><text x="254.24087591240874" y="229.95000000000002" text-anchor="start">9,750.000</text><text x="183" y="311.61666666666673" text-anchor="end">有效采购成本</text><rect x="195.0" y="275.33333333333337" width="540.0" height="67.66666666666667" fill="none" stroke="currentColor" stroke-width="2"/><text x="743.0" y="311.61666666666673" text-anchor="start">102,750.000</text><line class="axis" x1="195.0" y1="105" x2="195.0" y2="350"/></svg>