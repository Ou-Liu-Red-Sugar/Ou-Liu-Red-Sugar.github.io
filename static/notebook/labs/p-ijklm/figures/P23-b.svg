<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-label="同一采购日，不同存续路径"><title>同一采购日，不同存续路径</title><desc>四方案都从106,000自有资金出发</desc><style>text{font-family:system-ui,sans-serif;fill:currentColor;font-size:15px} .title{font-size:22px;font-weight:650} .sub{font-size:14px} .axis{stroke:currentColor;stroke-width:1;opacity:.45} .grid{stroke:currentColor;stroke-width:1;opacity:.12}</style><text class="title" x="30" y="32">同一采购日，不同存续路径</text><text class="sub" x="30" y="57">四方案都从106,000自有资金出发</text><text x="30" y="88">有效采购成本，美元</text><text x="183" y="137.4625" text-anchor="end">3张，停仓</text><rect x="195.0" y="112.0" width="540.0" height="47.25" fill="none" stroke="currentColor" stroke-width="2"/><text x="743.0" y="137.4625" text-anchor="start">102,750.000</text><text x="183" y="198.7125" text-anchor="end">2张，存续</text><rect x="195.0" y="173.25" width="462.4817518248175" height="47.25" fill="none" stroke="currentColor" stroke-width="2"/><text x="665.4817518248175" y="198.7125" text-anchor="start">88,000.000</text><text x="183" y="259.9625" text-anchor="end">3张，承诺融资</text><rect x="195.0" y="234.5" width="449.3826617338267" height="47.25" fill="none" stroke="currentColor" stroke-width="2"/><text x="652.3826617338267" y="259.9625" text-anchor="start">85,507.534</text><text x="183" y="321.2125" text-anchor="end">不对冲</text><rect x="195.0" y="295.75" width="488.7591240875913" height="47.25" fill="none" stroke="currentColor" stroke-width="2"/><text x="691.7591240875913" y="321.2125" text-anchor="start">93,000.000</text><line class="axis" x1="195.0" y1="105" x2="195.0" y2="350"/></svg>