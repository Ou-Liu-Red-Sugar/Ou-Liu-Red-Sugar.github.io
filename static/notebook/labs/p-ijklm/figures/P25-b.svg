<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 361" role="img" aria-label="每一层结论都需要对应证据"><title>每一层结论都需要对应证据</title><desc>不是把历史平均权利金换一个名称</desc><style>text{font-family:system-ui,sans-serif;fill:currentColor;font-size:15px} .title{font-size:22px;font-weight:650} .sub{font-size:14px} .axis{stroke:currentColor;stroke-width:1;opacity:.45} .grid{stroke:currentColor;stroke-width:1;opacity:.12}</style><text class="title" x="30" y="32">每一层结论都需要对应证据</text><text class="sub" x="30" y="57">不是把历史平均权利金换一个名称</text><rect x="25" y="85" width="750" height="65" rx="6" fill="none" stroke="currentColor" stroke-opacity=".3"/><text x="42" y="110" font-weight="650">原始结果</text><text x="285" y="110">净支付 / 明确资本分母</text><text x="285" y="134">不能把保费分母和标的分母混用</text><rect x="25" y="167" width="750" height="65" rx="6" fill="none" stroke="currentColor" stroke-opacity=".3"/><text x="42" y="192" font-weight="650">风险调整</text><text x="285" y="192">CAPM alpha与残差标准差</text><text x="285" y="216">IR：固定比例缩放不变，变动比例需重估</text><rect x="25" y="249" width="750" height="65" rx="6" fill="none" stroke="currentColor" stroke-opacity=".3"/><text x="42" y="274" font-weight="650">后续检验</text><text x="285" y="274">先冻结规则再评价未知时期</text><text x="285" y="298">事后断点与真正滚动样本外不同</text></svg>