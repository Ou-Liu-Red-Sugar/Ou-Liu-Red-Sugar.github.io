<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 361" role="img" aria-label="用DV01而不是票面本金匹配"><title>用DV01而不是票面本金匹配</title><desc>CME 2020年发行对冲教学例；不是当前DV01</desc><style>text{font-family:system-ui,sans-serif;fill:currentColor;font-size:15px} .title{font-size:22px;font-weight:650} .sub{font-size:14px} .axis{stroke:currentColor;stroke-width:1;opacity:.45} .grid{stroke:currentColor;stroke-width:1;opacity:.12}</style><text class="title" x="30" y="32">用DV01而不是票面本金匹配</text><text class="sub" x="30" y="57">CME 2020年发行对冲教学例；不是当前DV01</text><rect x="25" y="85" width="750" height="65" rx="6" fill="none" stroke="currentColor" stroke-opacity=".3"/><text x="42" y="110" font-weight="650">代理证券</text><text x="285" y="110">56.11美元/bp / 200,000美元本金</text><text x="285" y="134">100m本金 → 28,055美元/bp</text><rect x="25" y="167" width="750" height="65" rx="6" fill="none" stroke="currentColor" stroke-opacity=".3"/><text x="42" y="192" font-weight="650">期货一张</text><text x="285" y="192">61.70美元/bp</text><text x="285" y="216">28,055 / 61.70 = 454.700162张</text><rect x="25" y="249" width="750" height="65" rx="6" fill="none" stroke="currentColor" stroke-opacity=".3"/><text x="42" y="274" font-weight="650">采用455张</text><text x="285" y="274">净DV01 = −18.50美元/bp</text><text x="285" y="298">利率平移+1bp → 合并近似+18.50美元</text></svg>