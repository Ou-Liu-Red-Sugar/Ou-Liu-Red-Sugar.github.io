<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 665" role="img" aria-label="短call被指派，并不会顺便关闭long put"><title>短call被指派，并不会顺便关闭long put</title><rect width="400" height="665" fill="white"/><g font-family="system-ui, Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#182936"><text x="15" y="26" font-size="16" fill="#182936">短call被指派，并不会顺便关闭long p</text><text x="15" y="47" font-size="16" fill="#182936">ut</text><rect x="15" y="68" width="370" height="150" rx="8" fill="#eff4f3" stroke="#bcced2"/><text x="28" y="93" font-size="14" fill="#145c70">D1三腿</text><text x="28" y="117" font-size="13" fill="#182936">股票100股</text><text x="28" y="141" font-size="13" fill="#182936">long P95 / short C105</text><text x="28" y="165" font-size="13" fill="#182936">现金2,015</text><text x="28" y="189" font-size="13" fill="#182936">净期权负债15</text><path d="M200 220v14l-4-4m4 4l4-4" stroke="#60757e" fill="none"/><rect x="15" y="237" width="370" height="150" rx="8" fill="#eff4f3" stroke="#bcced2"/><text x="28" y="262" font-size="14" fill="#a2682d">D10：short call指派</text><text x="28" y="286" font-size="13" fill="#182936">股票交出100股</text><text x="28" y="310" font-size="13" fill="#182936">收到10,500</text><text x="28" y="334" font-size="13" fill="#182936">现金12,515</text><text x="28" y="358" font-size="13" fill="#182936">long put仍存续</text><path d="M200 389v14l-4-4m4 4l4-4" stroke="#60757e" fill="none"/><rect x="15" y="406" width="370" height="150" rx="8" fill="#eff4f3" stroke="#bcced2"/><text x="28" y="431" font-size="14" fill="#607298">下一项决策</text><text x="28" y="455" font-size="13" fill="#182936">持有/卖出剩余put？</text><text x="28" y="479" font-size="13" fill="#182936">新put报价未给</text><text x="28" y="503" font-size="13" fill="#182936">总财富＝现金＋put mark</text><text x="28" y="527" font-size="13" fill="#182936">不用零填未知价值</text><text x="15" y="603" font-size="12" fill="#536675">只持股对照：108×100＋2,000现金＋100股</text><text x="15" y="622" font-size="12" fill="#536675">息＝12,900。</text></g></svg>