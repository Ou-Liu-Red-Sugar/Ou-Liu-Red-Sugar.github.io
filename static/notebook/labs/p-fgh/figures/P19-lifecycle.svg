<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 350" role="img" aria-label="SPXW教学现金路径：先付近端，再决定远腿"><title>SPXW教学现金路径：先付近端，再决定远腿</title><rect width="860" height="350" fill="white"/><g font-family="system-ui, Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#182936"><text x="22" y="30" font-size="19" font-weight="700">SPXW教学现金路径：先付近端，再决定远腿</text><rect x="23.0" y="62" width="255.33333333333334" height="181" rx="8" fill="#eff4f3" stroke="#bcced2"/><text x="36.0" y="89" font-size="15" fill="#145c70" font-weight="700">D1（5000点起点）</text><text x="36.0" y="118" font-size="13">共同财富600,000</text><text x="36.0" y="145" font-size="13">mid debit12,550</text><text x="36.0" y="172" font-size="13">现金587,450</text><text x="36.0" y="199" font-size="13">两腿单位均100美元/点</text><path d="M281.33333333333337 150h17l-5-4m5 4l-5 4" fill="none" stroke="#526c78" stroke-width="2"/><rect x="302.33333333333337" y="62" width="255.33333333333334" height="181" rx="8" fill="#eff4f3" stroke="#bcced2"/><text x="315.33333333333337" y="89" font-size="15" fill="#a2682d" font-weight="700">D31（近端7000）</text><text x="315.33333333333337" y="118" font-size="13">short近腿付200,000</text><text x="315.33333333333337" y="145" font-size="13">现金剩387,450</text><text x="315.33333333333337" y="172" font-size="13">far call仍有价值</text><text x="315.33333333333337" y="199" font-size="13">关闭或续持是不同选择</text><path d="M560.6666666666667 150h17l-5-4m5 4l-5 4" fill="none" stroke="#526c78" stroke-width="2"/><rect x="581.6666666666667" y="62" width="255.33333333333334" height="181" rx="8" fill="#eff4f3" stroke="#bcced2"/><text x="594.6666666666667" y="89" font-size="15" fill="#607298" font-weight="700">D91（远端4000）</text><text x="594.6666666666667" y="118" font-size="13">若继续持有far call</text><text x="594.6666666666667" y="145" font-size="13">其到期支付为0</text><text x="594.6666666666667" y="172" font-size="13">终财富387,450</text><text x="594.6666666666667" y="199" font-size="13">整个路径损失212,550</text><text x="23" y="273" font-size="13">0.65/张费用不乘50；现金不足则停在付款点，不输出后续已完成路径。</text></g></svg>