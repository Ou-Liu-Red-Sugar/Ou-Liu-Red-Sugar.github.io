<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 665" role="img" aria-label="净取得成本不能替代交割总付款"><title>净取得成本不能替代交割总付款</title><rect width="400" height="665" fill="white"/><g font-family="system-ui, Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#182936"><text x="15" y="26" font-size="16" fill="#182936">净取得成本不能替代交割总付款</text><rect x="15" y="68" width="370" height="150" rx="8" fill="#eff4f3" stroke="#bcced2"/><text x="28" y="93" font-size="14" fill="#145c70">D1资金与负债</text><text x="28" y="117" font-size="13" fill="#182936">现金12,142</text><text x="28" y="141" font-size="13" fill="#182936">短put负债142</text><text x="28" y="165" font-size="13" fill="#182936">接股预留9,500</text><text x="28" y="189" font-size="13" fill="#182936">净财富12,000</text><path d="M200 220v14l-4-4m4 4l4-4" stroke="#60757e" fill="none"/><rect x="15" y="237" width="370" height="150" rx="8" fill="#eff4f3" stroke="#bcced2"/><text x="28" y="262" font-size="14" fill="#a2682d">提前指派压力</text><text x="28" y="286" font-size="13" fill="#182936">股票当时75</text><text x="28" y="310" font-size="13" fill="#182936">应付总款9,500</text><text x="28" y="334" font-size="13" fill="#182936">及时可达9,000</text><text x="28" y="358" font-size="13" fill="#182936">仍缺500，停止</text><path d="M200 389v14l-4-4m4 4l4-4" stroke="#60757e" fill="none"/><rect x="15" y="406" width="370" height="150" rx="8" fill="#eff4f3" stroke="#bcced2"/><text x="28" y="431" font-size="14" fill="#607298">若及时付款完整</text><text x="28" y="455" font-size="13" fill="#182936">现金2,642</text><text x="28" y="479" font-size="13" fill="#182936">100股×75＝7,500</text><text x="28" y="503" font-size="13" fill="#182936">完整财富10,142</text><text x="28" y="527" font-size="13" fill="#182936">不是支付净成本9,358</text><text x="15" y="603" font-size="12" fill="#536675">相同总资产不代表在相同账户/截止时间可以使用。</text></g></svg>