<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 665" role="img" aria-label="先定义风险单位，再定义现金时点"><title>先定义风险单位，再定义现金时点</title><rect width="400" height="665" fill="white"/><g font-family="system-ui, Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#182936"><text x="15" y="26" font-size="16" fill="#182936">先定义风险单位，再定义现金时点</text><rect x="15" y="68" width="370" height="150" rx="8" fill="#eff4f3" stroke="#bcced2"/><text x="28" y="93" font-size="14" fill="#145c70">今天：原敞口</text><text x="28" y="117" font-size="13" fill="#182936">100股×100＋现金2,000</text><text x="28" y="141" font-size="13" fill="#182936">选择减持/put/领口</text><text x="28" y="165" font-size="13" fill="#182936">持股数量会不同</text><text x="28" y="189" font-size="13" fill="#182936">权利金不是保证金</text><path d="M200 220v14l-4-4m4 4l4-4" stroke="#60757e" fill="none"/><rect x="15" y="237" width="370" height="150" rx="8" fill="#eff4f3" stroke="#bcced2"/><text x="28" y="262" font-size="14" fill="#a2682d">D20：现金任务</text><text x="28" y="286" font-size="13" fill="#182936">股票市值≠现金</text><text x="28" y="310" font-size="13" fill="#182936">期权mark≠已成交款</text><text x="28" y="334" font-size="13" fill="#182936">要核账户与截止</text><text x="28" y="358" font-size="13" fill="#182936">付款路径必须另列</text><path d="M200 389v14l-4-4m4 4l4-4" stroke="#60757e" fill="none"/><rect x="15" y="406" width="370" height="150" rx="8" fill="#eff4f3" stroke="#bcced2"/><text x="28" y="431" font-size="14" fill="#607298">D30：终点保护</text><text x="28" y="455" font-size="13" fill="#182936">要求财富≥11,300</text><text x="28" y="479" font-size="13" fill="#182936">还要求保留全部高价上涨</text><text x="28" y="503" font-size="13" fill="#182936">本例只有95 put通过</text><text x="28" y="527" font-size="13" fill="#182936">不等于D20一定可付款</text><text x="15" y="603" font-size="12" fill="#536675">高价斜率、全价格下限和及时现金，是三个不同约束。</text></g></svg>