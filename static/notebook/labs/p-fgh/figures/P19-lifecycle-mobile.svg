<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 665" role="img" aria-label="SPXW教学现金路径：先付近端，再决定远腿"><title>SPXW教学现金路径：先付近端，再决定远腿</title><rect width="400" height="665" fill="white"/><g font-family="system-ui, Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#182936"><text x="15" y="26" font-size="16" fill="#182936">SPXW教学现金路径：先付近端，再决定远腿</text><rect x="15" y="68" width="370" height="150" rx="8" fill="#eff4f3" stroke="#bcced2"/><text x="28" y="93" font-size="14" fill="#145c70">D1（5000点起点）</text><text x="28" y="117" font-size="13" fill="#182936">共同财富600,000</text><text x="28" y="141" font-size="13" fill="#182936">mid debit12,550</text><text x="28" y="165" font-size="13" fill="#182936">现金587,450</text><text x="28" y="189" font-size="13" fill="#182936">两腿单位均100美元/点</text><path d="M200 220v14l-4-4m4 4l4-4" stroke="#60757e" fill="none"/><rect x="15" y="237" width="370" height="150" rx="8" fill="#eff4f3" stroke="#bcced2"/><text x="28" y="262" font-size="14" fill="#a2682d">D31（近端7000）</text><text x="28" y="286" font-size="13" fill="#182936">short近腿付200,000</text><text x="28" y="310" font-size="13" fill="#182936">现金剩387,450</text><text x="28" y="334" font-size="13" fill="#182936">far call仍有价值</text><text x="28" y="358" font-size="13" fill="#182936">关闭或续持是不同选择</text><path d="M200 389v14l-4-4m4 4l4-4" stroke="#60757e" fill="none"/><rect x="15" y="406" width="370" height="150" rx="8" fill="#eff4f3" stroke="#bcced2"/><text x="28" y="431" font-size="14" fill="#607298">D91（远端4000）</text><text x="28" y="455" font-size="13" fill="#182936">若继续持有far call</text><text x="28" y="479" font-size="13" fill="#182936">其到期支付为0</text><text x="28" y="503" font-size="13" fill="#182936">终财富387,450</text><text x="28" y="527" font-size="13" fill="#182936">整个路径损失212,550</text><text x="15" y="603" font-size="12" fill="#536675">0.65/张费用不乘50；现金不足则停在付款点，不输</text><text x="15" y="622" font-size="12" fill="#536675">出后续已完成路径。</text></g></svg>