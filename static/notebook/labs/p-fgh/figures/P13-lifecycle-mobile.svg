<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 665" role="img" aria-label="不是少算一次股息，而是完整账户发生变化"><title>不是少算一次股息，而是完整账户发生变化</title><rect width="400" height="665" fill="white"/><g font-family="system-ui, Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#182936"><text x="15" y="26" font-size="16" fill="#182936">不是少算一次股息，而是完整账户发生变化</text><rect x="15" y="68" width="370" height="150" rx="8" fill="#eff4f3" stroke="#bcced2"/><text x="28" y="93" font-size="14" fill="#145c70">D0→D1</text><text x="28" y="117" font-size="13" fill="#182936">已有100股</text><text x="28" y="141" font-size="13" fill="#182936">现金2,000 → 2,157</text><text x="28" y="165" font-size="13" fill="#182936">短call负债157</text><text x="28" y="189" font-size="13" fill="#182936">净财富仍12,000</text><path d="M200 220v14l-4-4m4 4l4-4" stroke="#60757e" fill="none"/><rect x="15" y="237" width="370" height="150" rx="8" fill="#eff4f3" stroke="#bcced2"/><text x="28" y="262" font-size="14" fill="#a2682d">D10指派（施加）</text><text x="28" y="286" font-size="13" fill="#182936">交出100股</text><text x="28" y="310" font-size="13" fill="#182936">应收10,500</text><text x="28" y="334" font-size="13" fill="#182936">交割后现金12,657</text><text x="28" y="358" font-size="13" fill="#182936">不再拥有股票</text><path d="M200 389v14l-4-4m4 4l4-4" stroke="#60757e" fill="none"/><rect x="15" y="406" width="370" height="150" rx="8" fill="#eff4f3" stroke="#bcced2"/><text x="28" y="431" font-size="14" fill="#607298">除息对照</text><text x="28" y="455" font-size="13" fill="#182936">只持股：109 → 108</text><text x="28" y="479" font-size="13" fill="#182936">100股×108＋现金2,000</text><text x="28" y="503" font-size="13" fill="#182936">另有股息100</text><text x="28" y="527" font-size="13" fill="#182936">完整财富12,900</text><text x="15" y="603" font-size="12" fill="#536675">指派与分红为独立教学事件；股息应收与已到账现金另区分</text><text x="15" y="622" font-size="12" fill="#536675">。</text></g></svg>