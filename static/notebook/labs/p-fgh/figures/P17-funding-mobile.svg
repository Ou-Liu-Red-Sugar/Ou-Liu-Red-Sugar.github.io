<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 665" role="img" aria-label="到期104.99：long100行权，short105不指派"><title>到期104.99：long100行权，short105不指派</title><rect width="400" height="665" fill="white"/><g font-family="system-ui, Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#182936"><text x="15" y="26" font-size="16" fill="#182936">到期104.99：long100行权，sho</text><text x="15" y="47" font-size="16" fill="#182936">rt105不指派</text><rect x="15" y="68" width="370" height="150" rx="8" fill="#eff4f3" stroke="#bcced2"/><text x="28" y="93" font-size="14" fill="#145c70">小钱包1,000</text><text x="28" y="117" font-size="13" fill="#182936">mid付186 → 余814</text><text x="28" y="141" font-size="13" fill="#182936">行权总付款10,000</text><text x="28" y="165" font-size="13" fill="#182936">缺口9,186</text><text x="28" y="189" font-size="13" fill="#182936">停止“已完成交割”</text><path d="M200 220v14l-4-4m4 4l4-4" stroke="#60757e" fill="none"/><rect x="15" y="237" width="370" height="150" rx="8" fill="#eff4f3" stroke="#bcced2"/><text x="28" y="262" font-size="14" fill="#a2682d">共同钱包12,000</text><text x="28" y="286" font-size="13" fill="#182936">mid付186 → 余11,814</text><text x="28" y="310" font-size="13" fill="#182936">付款10,000 → 余1,814</text><text x="28" y="334" font-size="13" fill="#182936">收到100股，按104.99</text><text x="28" y="358" font-size="13" fill="#182936">总财富12,313</text><path d="M200 389v14l-4-4m4 4l4-4" stroke="#60757e" fill="none"/><rect x="15" y="406" width="370" height="150" rx="8" fill="#eff4f3" stroke="#bcced2"/><text x="28" y="431" font-size="14" fill="#607298">若股票随后到80</text><text x="28" y="455" font-size="13" fill="#182936">现金仍1,814</text><text x="28" y="479" font-size="13" fill="#182936">股票价值8,000</text><text x="28" y="503" font-size="13" fill="#182936">财富9,814</text><text x="28" y="527" font-size="13" fill="#182936">这是新股仓的损失</text><text x="15" y="603" font-size="12" fill="#536675">小debit是期权成本，不是实物交割付款能力。</text></g></svg>