<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 350" role="img" aria-label="不是少算一次股息，而是完整账户发生变化"><title>不是少算一次股息，而是完整账户发生变化</title><rect width="860" height="350" fill="white"/><g font-family="system-ui, Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#182936"><text x="22" y="30" font-size="19" font-weight="700">不是少算一次股息，而是完整账户发生变化</text><rect x="23.0" y="62" width="255.33333333333334" height="181" rx="8" fill="#eff4f3" stroke="#bcced2"/><text x="36.0" y="89" font-size="15" fill="#145c70" font-weight="700">D0→D1</text><text x="36.0" y="118" font-size="13">已有100股</text><text x="36.0" y="145" font-size="13">现金2,000 → 2,157</text><text x="36.0" y="172" font-size="13">短call负债157</text><text x="36.0" y="199" font-size="13">净财富仍12,000</text><path d="M281.33333333333337 150h17l-5-4m5 4l-5 4" fill="none" stroke="#526c78" stroke-width="2"/><rect x="302.33333333333337" y="62" width="255.33333333333334" height="181" rx="8" fill="#eff4f3" stroke="#bcced2"/><text x="315.33333333333337" y="89" font-size="15" fill="#a2682d" font-weight="700">D10指派（施加）</text><text x="315.33333333333337" y="118" font-size="13">交出100股</text><text x="315.33333333333337" y="145" font-size="13">应收10,500</text><text x="315.33333333333337" y="172" font-size="13">交割后现金12,657</text><text x="315.33333333333337" y="199" font-size="13">不再拥有股票</text><path d="M560.6666666666667 150h17l-5-4m5 4l-5 4" fill="none" stroke="#526c78" stroke-width="2"/><rect x="581.6666666666667" y="62" width="255.33333333333334" height="181" rx="8" fill="#eff4f3" stroke="#bcced2"/><text x="594.6666666666667" y="89" font-size="15" fill="#607298" font-weight="700">除息对照</text><text x="594.6666666666667" y="118" font-size="13">只持股：109 → 108</text><text x="594.6666666666667" y="145" font-size="13">100股×108＋现金2,000</text><text x="594.6666666666667" y="172" font-size="13">另有股息100</text><text x="594.6666666666667" y="199" font-size="13">完整财富12,900</text><text x="23" y="273" font-size="13">指派与分红为独立教学事件；股息应收与已到账现金另区分。</text></g></svg>