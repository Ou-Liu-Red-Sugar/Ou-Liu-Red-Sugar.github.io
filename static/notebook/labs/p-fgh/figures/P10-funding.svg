<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 350" role="img" aria-label="先定义风险单位，再定义现金时点"><title>先定义风险单位，再定义现金时点</title><rect width="860" height="350" fill="white"/><g font-family="system-ui, Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#182936"><text x="22" y="30" font-size="19" font-weight="700">先定义风险单位，再定义现金时点</text><rect x="23.0" y="62" width="255.33333333333334" height="181" rx="8" fill="#eff4f3" stroke="#bcced2"/><text x="36.0" y="89" font-size="15" fill="#145c70" font-weight="700">今天：原敞口</text><text x="36.0" y="118" font-size="13">100股×100＋现金2,000</text><text x="36.0" y="145" font-size="13">选择减持/put/领口</text><text x="36.0" y="172" font-size="13">持股数量会不同</text><text x="36.0" y="199" font-size="13">权利金不是保证金</text><path d="M281.33333333333337 150h17l-5-4m5 4l-5 4" fill="none" stroke="#526c78" stroke-width="2"/><rect x="302.33333333333337" y="62" width="255.33333333333334" height="181" rx="8" fill="#eff4f3" stroke="#bcced2"/><text x="315.33333333333337" y="89" font-size="15" fill="#a2682d" font-weight="700">D20：现金任务</text><text x="315.33333333333337" y="118" font-size="13">股票市值≠现金</text><text x="315.33333333333337" y="145" font-size="13">期权mark≠已成交款</text><text x="315.33333333333337" y="172" font-size="13">要核账户与截止</text><text x="315.33333333333337" y="199" font-size="13">付款路径必须另列</text><path d="M560.6666666666667 150h17l-5-4m5 4l-5 4" fill="none" stroke="#526c78" stroke-width="2"/><rect x="581.6666666666667" y="62" width="255.33333333333334" height="181" rx="8" fill="#eff4f3" stroke="#bcced2"/><text x="594.6666666666667" y="89" font-size="15" fill="#607298" font-weight="700">D30：终点保护</text><text x="594.6666666666667" y="118" font-size="13">要求财富≥11,300</text><text x="594.6666666666667" y="145" font-size="13">还要求保留全部高价上涨</text><text x="594.6666666666667" y="172" font-size="13">本例只有95 put通过</text><text x="594.6666666666667" y="199" font-size="13">不等于D20一定可付款</text><text x="23" y="273" font-size="13">高价斜率、全价格下限和及时现金，是三个不同约束。</text></g></svg>