<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 350" role="img" aria-label="净取得成本不能替代交割总付款"><title>净取得成本不能替代交割总付款</title><rect width="860" height="350" fill="white"/><g font-family="system-ui, Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#182936"><text x="22" y="30" font-size="19" font-weight="700">净取得成本不能替代交割总付款</text><rect x="23.0" y="62" width="255.33333333333334" height="181" rx="8" fill="#eff4f3" stroke="#bcced2"/><text x="36.0" y="89" font-size="15" fill="#145c70" font-weight="700">D1资金与负债</text><text x="36.0" y="118" font-size="13">现金12,142</text><text x="36.0" y="145" font-size="13">短put负债142</text><text x="36.0" y="172" font-size="13">接股预留9,500</text><text x="36.0" y="199" font-size="13">净财富12,000</text><path d="M281.33333333333337 150h17l-5-4m5 4l-5 4" fill="none" stroke="#526c78" stroke-width="2"/><rect x="302.33333333333337" y="62" width="255.33333333333334" height="181" rx="8" fill="#eff4f3" stroke="#bcced2"/><text x="315.33333333333337" y="89" font-size="15" fill="#a2682d" font-weight="700">提前指派压力</text><text x="315.33333333333337" y="118" font-size="13">股票当时75</text><text x="315.33333333333337" y="145" font-size="13">应付总款9,500</text><text x="315.33333333333337" y="172" font-size="13">及时可达9,000</text><text x="315.33333333333337" y="199" font-size="13">仍缺500，停止</text><path d="M560.6666666666667 150h17l-5-4m5 4l-5 4" fill="none" stroke="#526c78" stroke-width="2"/><rect x="581.6666666666667" y="62" width="255.33333333333334" height="181" rx="8" fill="#eff4f3" stroke="#bcced2"/><text x="594.6666666666667" y="89" font-size="15" fill="#607298" font-weight="700">若及时付款完整</text><text x="594.6666666666667" y="118" font-size="13">现金2,642</text><text x="594.6666666666667" y="145" font-size="13">100股×75＝7,500</text><text x="594.6666666666667" y="172" font-size="13">完整财富10,142</text><text x="594.6666666666667" y="199" font-size="13">不是支付净成本9,358</text><text x="23" y="273" font-size="13">相同总资产不代表在相同账户/截止时间可以使用。</text></g></svg>