baseURL: "https://ou-liu-red-sugar.github.io/"
title: "Ou Liu"
theme: "PaperMod"
languageCode: "en-us"
defaultContentLanguage: "en"

enableInlineShortcodes: true

# Search needs JSON output on home
outputs:
  home:
    - HTML
    - RSS
    - JSON
  section:
    - HTML
    - RSS

# Clean permalinks for sections
permalinks:
  notes: /notes/:sections[1:]/:slug/
  papers: /papers/:slug/
  invest: /invest/:slug/
  "invest/log": /invest/log/:slug/
  "invest/lessons": /invest/lessons/:slug/
  "invest/reviews": /invest/reviews/:slug/
  wiki: /wiki/:slug/

menu:
  main:
    - identifier: invest
      name: Investing Lab
      url: /invest/
      weight: 10
    - identifier: learning
      name: Learning Notes
      url: /learning/
      weight: 20
    - identifier: archive
      name: Math Archive
      url: /notes/
      weight: 30
    - identifier: about
      name: About
      url: /about/
      weight: 40

params:
  env: production
  description: "Learning stochastic processes and financial markets while testing an investing research framework in live practice."
  author: "Ou Liu"

  # PaperMod UX
  ShowPostNavLinks: true
  defaultTheme: light
  disableThemeToggle: true
  math: false

  # Reading experience (PaperMod keys are case-sensitive)
  ShowToc: true
  TocOpen: false
  ShowReadingTime: true
  ShowCodeCopyButtons: true

  customCSS:
    - css/custom.css

markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - ["\\[", "\\]"]
            - ["$$", "$$"]
          inline:
            - ["$", "$"]
            - ["\\(", "\\)"]

enableRobotsTXT: true

sitemap:
  changefreq: weekly
  priority: 0.5
  filename: sitemap.xml
