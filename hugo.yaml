baseURL: https://ou-liu-red-sugar.github.io/
title: Ou Liu
theme: PaperMod
languageCode: en-us
defaultContentLanguage: zh
enableInlineShortcodes: true
outputs:
  home:
  - HTML
  - RSS
  - JSON
  section:
  - HTML
  - RSS
permalinks:
  notes: /notes/:sections[1:]/:slug/
  papers: /papers/:slug/
  invest: /invest/:slug/
  invest/log: /invest/log/:slug/
  invest/lessons: /invest/lessons/:slug/
  invest/reviews: /invest/reviews/:slug/
  wiki: /wiki/:slug/
menu: {}
params:
  assets:
    favicon: /favicon/favicon.svg
  env: production
  author: Ou Liu
  ShowPostNavLinks: false
  defaultTheme: light
  disableThemeToggle: true
  math: false
  ShowToc: true
  TocOpen: false
  ShowReadingTime: true
  ShowCodeCopyButtons: true
  discussions:
    enabled: true
    repo: Ou-Liu-Red-Sugar/Ou-Liu-Red-Sugar.github.io
    repoId: R_kgDOQt9h3w
    publicBaseURL: https://ou-liu-red-sugar.github.io/
    category: Announcements
    categoryId: DIC_kwDOQt9h384DGD5i
  customCSS:
  - css/custom.css
markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
          - - \[
            - \]
          - - $$
            - $$
          inline:
          - - $
            - $
          - - \(
            - \)
  tableOfContents:
    startLevel: 2
    endLevel: 3
enableRobotsTXT: true
sitemap:
  changefreq: weekly
  priority: 0.5
  filename: sitemap.xml
defaultContentLanguageInSubdir: true
languages:
  zh:
    languageCode: zh-CN
    languageName: 中文
    contentDir: content-zh
    weight: 1
    title: 刘欧 · 笔记
    params:
      description: 刘欧的个人主页：数学讲义与讨论班讲稿、和 Agent 逐篇写作的投资学笔记，以及写作与研究方法的 Blog.
  en:
    languageCode: en-US
    languageName: English
    contentDir: content
    weight: 2
    title: Ou Liu · Notes
    params:
      description: Ou Liu's personal site, with lecture and seminar notes in mathematics, an investment notebook written with Agents, and a blog on writing and research methods.
disableKinds: []
module:
  mounts:
    - source: content-zh
      target: content
      lang: zh
    - source: content
      target: content
      lang: en
