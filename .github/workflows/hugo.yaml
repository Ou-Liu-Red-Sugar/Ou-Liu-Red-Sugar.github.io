name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.152.2
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Compile notebook content and Agent exports
        run: python3 tools/build_notebook.py
      - name: Check interactive calculations
        run: node --test tools/notebook-math.test.mjs tools/notebook-number-format.test.cjs
      - name: Check Markdown export preservation
        run: python3 -m unittest discover -s tools -p test_llms_export.py
      - name: Build with Hugo
        run: hugo --minify --destination "${{ runner.temp }}/site"
      - name: Check site links and Agent exports
        run: python3 tools/check_notebook.py --build-dir "${{ runner.temp }}/site"
      - name: Check LLMS text and URLs
        run: python3 tools/check_llms.py --build-dir "${{ runner.temp }}/site"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

