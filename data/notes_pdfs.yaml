- title: Six Functors and Gestalten
  description: 'Talk script following Scholze''s "Geometry and Higher Category Theory" (Lecture IX). Starting from
    a presentable six-functor formalism, we construct its transmutation into the category of Gestalten (Stefanich
    rings) via the category of kernels, factoring the formalism as "geometry plus quasicoherent sheaves". Archived
    as an unfinished draft.

    '
