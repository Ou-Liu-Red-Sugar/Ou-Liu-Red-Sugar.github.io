{{ define "main" }}
<section class="section-page blog-index" aria-labelledby="blog-title">
  <header class="page-head">
    <p class="kicker">Blog · 刘欧</p>
    <h1 id="blog-title">{{ .Title }}</h1>
    {{ with .Description }}<p class="page-deck">{{ . }}</p>{{ end }}
  </header>
  {{ partial "blog/entries.html" .RegularPages.ByDate.Reverse }}
</section>
{{ end }}
