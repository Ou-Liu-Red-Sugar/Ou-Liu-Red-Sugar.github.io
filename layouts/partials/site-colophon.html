{{ $zh := eq .Lang "zh" }}
<footer class="site-colophon">
  <div class="colophon-bar">
    <span class="colophon-copy">© {{ now.Year }} {{ if $zh }}刘欧 Ou Liu{{ else }}Ou Liu 刘欧{{ end }}</span>
    <nav class="colophon-links" aria-label="{{ if $zh }}页尾导航{{ else }}Footer navigation{{ end }}">
      <a href="/{{ .Lang }}/about/">{{ if $zh }}关于{{ else }}About{{ end }}</a>
      <a href="mailto:ouliuredsugar@gmail.com">{{ if $zh }}邮件{{ else }}Email{{ end }}</a>
      <a href="https://github.com/Ou-Liu-Red-Sugar/Ou-Liu-Red-Sugar.github.io" rel="noopener">GitHub</a>
      <a href="/agent/{{ .Lang }}/index.md">{{ if $zh }}Agent 索引{{ else }}Agent index{{ end }}</a>
      <a href="/llms.txt">llms.txt</a>
      <a href="/{{ cond $zh "en" "zh" }}/" lang="{{ cond $zh "en" "zh" }}">{{ if $zh }}English{{ else }}中文{{ end }}</a>
    </nav>
  </div>
</footer>
